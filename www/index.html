<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS Fahr-Dashboard</title>
<style>
:root{--bg:#0b0f14;--card:#141b24;--txt:#e8eef5;--mut:#7d8a99;--warn:#ff5252;--ok:#3ddc97}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-wrap:wrap;gap:8px;padding:8px;height:100%;align-content:flex-start;overflow:auto;padding-top:48px}
.w{background:var(--card);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1 1 160px;min-width:120px;min-height:110px;position:relative;text-align:center}
.w h4{margin:0 0 4px;font-size:11px;color:var(--mut);font-weight:500;letter-spacing:.5px}
#b-speed{width:100%}
.big{font-size:calc(var(--s,1)*64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.unit{font-size:14px;color:var(--mut)}
.small{font-size:calc(var(--s,1)*13px);color:var(--mut);margin-top:4px}
.alert{display:none;position:absolute;top:0;left:0;right:0;padding:4px;background:var(--warn);color:#000;font-weight:700;font-size:13px;border-radius:14px 14px 0 0}
.analog{width:100%;max-width:230px}
.allgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;width:100%}
.allgrid .tile{background:#0b1118;border-radius:10px;padding:6px 8px;text-align:left}
.rg{width:100%;max-width:300px;height:auto}
.th{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:4px}
.th-num{font-weight:900;line-height:1;font-size:calc(var(--s,1)*96px);font-variant-numeric:tabular-nums}
.th-unit{letter-spacing:3px;font-size:12px;color:var(--mut)}
.th-bar{width:90%;height:10px;background:#222;margin-top:6px;overflow:hidden;border-radius:3px}
.th-bar i{display:block;height:10px;transition:width .25s}
.th-sport .th-num{color:#ff3b1f;font-style:italic;text-shadow:0 0 12px #ff3b1f55}
.th-sport .th-bar i{background:#ff3b1f;transform:skewX(-14deg)}
.th-racer .th-num{color:#fff;font-style:italic;text-shadow:0 0 18px #2a7bff}
.th-racer .th-unit{color:#7fe0ff}
.th-racer .th-bar i{background:linear-gradient(90deg,#2a7bff,#7fe0ff)}
.th-robust{border:3px solid #ddd;border-radius:6px;padding:8px;background:#1a1a1a}
.th-robust .th-box{background:#000;padding:4px 16px;border:2px solid #ddd}
.th-robust .th-num{font-family:monospace;font-weight:800;font-size:calc(var(--s,1)*80px)}
.th-neutral .th-num{font-weight:300;color:#cfd6df}
.th-spiel .th-num{background:linear-gradient(90deg,#ff4fd8,#7fffd4,#ffd84f);-webkit-background-clip:text;background-clip:text;color:transparent}
.th-spiel .th-unit{color:#7fffd4}
details.anl{margin:6px 0;background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.5}
details.anl summary{cursor:pointer;font-weight:700}
ul.list{list-style:none;padding:0;margin:0;font-size:13px;width:100%}
ul.list li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #223040;padding:4px 0}
li.nav{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#navsheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:12}
#navsheet.open{display:flex}
#navbox{background:var(--card);width:min(420px,100%);border-radius:16px 16px 0 0;padding:14px;display:flex;flex-direction:column;gap:8px}
#navbox button{padding:14px;font-size:16px}
#mic{position:fixed;top:6px;right:52px;z-index:5;background:#22303f;color:var(--txt);border:0;border-radius:8px;padding:6px 10px;font-size:18px}
#mic.on{background:#8b1111}
#mic.talk{box-shadow:0 0 12px 3px #ff2a2a}
#scan{display:none;position:fixed;top:0;left:0;right:0;height:5px;z-index:11;background:linear-gradient(90deg,transparent,#ff1a1a,transparent);background-size:30% 100%;background-repeat:no-repeat;animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{background-position:0 0}to{background-position:100% 0}}
#toast{display:none;position:fixed;left:8px;right:8px;bottom:12px;z-index:13;background:rgba(20,27,36,.95);border:1px solid #ff2a2a;border-radius:10px;padding:10px;font-size:15px}
label.sc{font-size:12px;color:var(--mut);margin-left:8px;white-space:nowrap}
.scr{max-height:230px;overflow-y:auto;width:100%;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{width:4px}
.scr::-webkit-scrollbar-thumb{background:#3a4a5c;border-radius:2px}
button.rf{margin-top:6px;padding:6px 12px;font-size:13px}
#boost{display:none;position:fixed;inset:0;z-index:14;pointer-events:none;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#fff;text-shadow:0 0 18px #ff1a1a;background:radial-gradient(circle,rgba(255,26,26,.55),rgba(0,0,0,.85));animation:pulse .5s ease-in-out infinite alternate}
#boost.on{display:flex}
@keyframes pulse{from{opacity:.75}to{opacity:1}}
#open{position:fixed;top:6px;right:6px;z-index:5;background:#22303f;color:var(--txt);border:0;border-radius:8px;padding:6px 10px;font-size:18px}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:flex-end;z-index:50}
#menu.open{display:flex}
#panel{background:var(--card);width:min(380px,100%);height:100%;overflow:auto;padding:14px;font-size:14px}
#panel h3{margin:16px 0 6px;color:var(--ok);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;flex-wrap:wrap}
button{background:#22303f;color:var(--txt);border:0;border-radius:8px;padding:8px 10px;font-size:14px}
input[type=color]{width:44px;height:28px;border:0;background:none}
input,select,textarea{background:#0b0f14;color:#fff;border:0;border-radius:8px;padding:6px}
#app{display:block;position:relative;padding:0;overflow:auto;isolation:isolate;z-index:0}
.w{position:absolute;flex:none;min-width:0;min-height:0;overflow:hidden auto;padding:6px}
.w.inst{padding:0;background:none;overflow:hidden}
.w.inst .ib{position:absolute;inset:0}
.ib{container-type:size;position:relative;background:#0b1118;border-radius:12px;overflow:hidden}
.ie{box-sizing:border-box}
.w.zoom{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;width:auto!important;height:auto!important;transform:none!important;z-index:60!important;border-radius:0}
.ov{display:none;position:absolute;inset:0;z-index:5;border:2px dashed #3aa0ff;background:rgba(58,160,255,.10);touch-action:none}
body.edit .ov{display:block}
body.edit .w{overflow:hidden}
.ov .hl{position:absolute;left:44px;right:80px;top:6px;font-size:12px;color:#fff;text-shadow:0 0 4px #000;pointer-events:none;overflow:hidden;white-space:nowrap}
.hx,.he,.hrot{position:absolute;top:4px;width:32px;height:32px;border-radius:50%;color:#fff;font:bold 16px/32px sans-serif;text-align:center;touch-action:none}
.hx{left:4px;background:#c0392b}.he{left:40px;top:40px;background:#2c7be5}.hrot{right:4px;background:#d68910}
.hr{position:absolute;right:0;bottom:0;width:38px;height:38px;background:#3aa0ff;border-radius:10px 0 8px 0;touch-action:none}
.rh{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;background:#ffb13b;border-radius:6px;touch-action:none}
#edbar{display:none;position:fixed;left:6px;right:6px;bottom:8px;z-index:30;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(20,27,36,.95);border:1px solid #3aa0ff;border-radius:12px;padding:8px}
#prof,#edt{position:fixed;top:6px;z-index:5;background:#22303f;color:var(--txt);border:0;border-radius:8px;padding:6px 10px;font-size:18px}
#prof{right:98px}#edt{right:144px}
#ied{position:fixed;inset:0;z-index:40;background:#0b0f14;display:flex;flex-direction:column}
#ied .ibar{display:flex;gap:6px;padding:8px}
#ied-stage{flex:1 1 auto;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05080d}
#ied-box{outline:1px solid #3a4a5c}
#ied-pal{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px}
#ied-props{max-height:38vh;overflow:auto;border-top:1px solid #223040;padding-bottom:10px}
details.sub{border-bottom:1px solid #223040;padding:4px 0}
details.sub>summary{cursor:pointer;color:var(--ok);font-size:15px;font-weight:700;padding:8px 0;list-style:none}
details.sub>summary::before{content:'▸ '}
details.sub[open]>summary::before{content:'▾ '}
</style>
</head>
<body>
<button id="open" aria-label="Menü">☰</button><button id="prof" aria-label="Profil">🚗</button><button id="edt" aria-label="Layout bearbeiten">✎</button><button id="mic" aria-label="Mikrofon">🎤</button><div id="scan"></div><div id="toast"></div><div id="boost"></div>
<div id="edbar"><button id="ed-done">Fertig</button><button id="ed-show">Fenster ein/aus</button><button id="ed-add">+ Instrument</button><button id="ed-reset">Layout zurücksetzen</button></div>
<div id="app"></div>
<div id="navsheet"><div id="navbox"></div></div>
<div id="menu"><div id="panel"></div></div>
<script>
const $=s=>document.querySelector(s);
const WIDGETS=[
{id:'speed',name:'Geschwindigkeit',base:320},
{id:'limit',name:'Erlaubt hier',base:170},
{id:'accel',name:'Beschleunigung',base:170},
{id:'trip',name:'Kilometer',base:200},
{id:'day',name:'Heute',base:200},
{id:'compass',name:'Kompass & Höhe',base:190},
{id:'weather',name:'Wetter',base:230},
{id:'warn',name:'DWD-Warnung',base:230},
{id:'heat',name:'Hitzewarnung',base:200},
{id:'sat',name:'GPS-Satelliten',base:260},
{id:'fuel',name:'Tankstellen (ohne Preise)',base:280},
{id:'traffic',name:'Stau-Meldungen',base:260},
{id:'custom',name:'Eigene Anzeige',base:220},
{id:'all',name:'Motorrad-Tasche',base:520},
{id:'range',name:'Tankreichweite',base:220},
{id:'obd',name:'Fahrzeug (OBD2)',base:300},
{id:'tour',name:'Tour & Pausen',base:260}];
const PAUSE_H=2;
// Richtwerte je Land (km/h): Ortschaft, Landstraße, Autobahn. Nur Fallback ohne OSM-Angabe.
const TAB={DE:{urban:50,rural:100,motorway:130},AT:{urban:50,rural:100,motorway:130},CH:{urban:50,rural:80,motorway:120},
FR:{urban:50,rural:80,motorway:130},IT:{urban:50,rural:90,motorway:130},NL:{urban:50,rural:80,motorway:100},PL:{urban:50,rural:90,motorway:140}};
const WX={0:'Sonne',1:'überwiegend sonnig',2:'teils bewölkt',3:'bedeckt',45:'Nebel',48:'Nebel',51:'Niesel',53:'Niesel',55:'Niesel',61:'Regen',63:'Regen',65:'starker Regen',71:'Schnee',73:'Schnee',75:'starker Schnee',80:'Schauer',81:'Schauer',82:'starke Schauer',95:'Gewitter',96:'Gewitter mit Hagel',99:'Gewitter mit Hagel'};
// Abfrage-Intervalle in Minuten; Datenquellen einzeln schaltbar, Datensparmodus schaltet alle Abrufe ab.
const DEF={global:{analog:false,awake:true,orient:'off',tol:5,tpl:'{speed} km/h · {temp}°C · Limit {limit}',sparmodus:false,style:'digital',voice:false,vmode:'push',vvol:80,vname:'',scFuel:false,scTraffic:false,wake:true,appCtl:true,uiCtl:false,btMic:false,keepAlive:false,obdOn:false,obdType:'bt',obdAddr:'',obdHost:'192.168.0.10',obdPort:35000,anrede:'Michael',vpitch:0.85,vrate:0.95,
 src:{weather:true,dwd:true,fuel:true,limit:true,heat:true,sat:true,autobahn:true},iv:{weather:30,dwd:15,fuel:30},fuelKm:5,},
 widgets:{},trip:{total:0,trip:0},day:{d:'',max:0,mt:0,dist:0},reports:[],last:{}};
WIDGETS.forEach(w=>DEF.widgets[w.id]={on:true,color:'#e8eef5',scale:1});
function load(){try{const x=JSON.parse(localStorage.getItem('gpsdash')||'null');if(x){const d=structuredClone(DEF);return Object.assign(d,x,{global:Object.assign(d.global,x.global,{src:Object.assign(d.global.src,x.global?.src||{}),iv:Object.assign(d.global.iv,x.global?.iv||{})}),widgets:Object.assign(d.widgets,x.widgets),trip:Object.assign(d.trip,x.trip),day:Object.assign(d.day,x.day)})}}catch(e){}return structuredClone(DEF)}
let S=load();
S.cache=Object.assign({fuel:[],ab:[],t:{}},S.cache||{});
S.tour=Object.assign({on:false,start:0,dist:0,mt:0,since:0,stopT:0,warned:false,max:0},S.tour||{});
S.tours=Array.isArray(S.tours)?S.tours:[];
if(S.global.analog){S.global.style='analog';S.global.analog=false}
function save(){try{localStorage.setItem('gpsdash',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dA=r(c-a),dB=r(d-b);const h=Math.sin(dA/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dB/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

// Zustand
let speedKmh=0,accel=null,zeroRes=null,gForce=0,heading=null,compassDev=null,limit=null,limitSrc='',fuelList=[],wx=null,warn=null,lat=null,lon=null,lastPos=null,zeroT=null;
let gpsAcc=null,alt=null,altAcc=null,ground=null,groundPos=null;
let limitT=0,fuelPos=null,wxPos=null,lastLimitPos=null,area=null,areaPos=null;

WIDGETS.forEach(w=>{const d=document.createElement('div');d.className='w';d.id='w-'+w.id;d.innerHTML=`<div class="alert" id="al-${w.id}"></div><h4>${w.name}</h4><div id="b-${w.id}"></div>`;$('#app').appendChild(d)});

function applyCfg(){
 WIDGETS.forEach(w=>{const c=S.widgets[w.id],el=$('#w-'+w.id);el.style.display=c.on?'':'none';el.style.color=c.color;el.style.flexBasis=(w.base*c.scale)+'px';el.style.setProperty('--s',c.scale)});
 const sp=$('#w-speed');if(LAND.includes(S.global.style)){sp.style.flexBasis='100%';sp.style.minWidth='100%'}else sp.style.minWidth='';
 $('#w-all').style.flexBasis='100%';$('#w-all').style.minWidth='100%';
}
const LAND=['cockpit','rund','sport','racer','robust','neutral','spiel'];
let wl=null;
async function wake(){try{if(S.global.awake&&'wakeLock' in navigator){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}else if(wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
async function applyOrient(){try{if(S.global.orient==='off'){screen.orientation.unlock()}else{await screen.orientation.lock(S.global.orient==='portrait'?'portrait-primary':'landscape-primary')}}catch(e){}}

function gauge(v){
 const max=220;let ticks='';
 for(let i=0;i<=max;i+=20){const a=(-135+270*i/max)*Math.PI/180;const x1=100+80*Math.sin(a),y1=100-80*Math.cos(a),x2=100+92*Math.sin(a),y2=100-92*Math.cos(a),tx=100+68*Math.sin(a),ty=100-68*Math.cos(a)+4;
  ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2"/><text x="${tx}" y="${ty}" font-size="11" text-anchor="middle" fill="currentColor">${i}</text>`}
 const ang=-135+270*Math.min(v,max)/max;
 return `<svg class="analog" viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="none" stroke="#2a3644" stroke-width="2"/>${ticks}<g transform="rotate(${ang} 100 100)"><line x1="100" y1="100" x2="100" y2="22" stroke="#ff5252" stroke-width="3"/></g><circle cx="100" cy="100" r="6" fill="currentColor"/><text x="100" y="150" font-size="18" text-anchor="middle" fill="currentColor">${Math.round(v)} km/h</text></svg>`;
}

function roundGauge(v){
 const max=200,f=Math.min(Math.max(v,0),max)/max,P=(d,r)=>[100+r*Math.cos(d*Math.PI/180),100+r*Math.sin(d*Math.PI/180)];
 const [sx,sy]=P(-210,80),[ex,ey]=P(-210+240*f,80),big=240*f>180?1:0,[bx,by]=P(30,80);
 let t='';for(let i=0;i<=40;i++){const d=-210+240*i/40,[x1,y1]=P(d,i%5?84:76),[x2,y2]=P(d,88);t+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${i%5?'#4d6480':'#dbe8f5'}" stroke-width="${i%5?1:2}"/>`;
  if(i%5===0){const [lx,ly]=P(d,62);t+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="9" text-anchor="middle" fill="#9fb6cc">${Math.round(max*i/40)}</text>`}}
 return `<svg class="rg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#0a1320" stroke="#1a2a3a" stroke-width="2"/><path d="M${sx.toFixed(1)} ${sy.toFixed(1)} A80 80 0 1 1 ${bx.toFixed(1)} ${by.toFixed(1)}" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>${f>0?`<path d="M${sx.toFixed(1)} ${sy.toFixed(1)} A80 80 0 ${big} 1 ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="#3aa0ff" stroke-width="8" stroke-linecap="round"/>`:''}${t}<text x="100" y="112" font-size="46" font-weight="700" text-anchor="middle" fill="#fff">${Math.round(v)}</text><text x="100" y="132" font-size="11" text-anchor="middle" fill="#7d95ad">km/h</text></svg>`;
}
function themeSpeed(v,st){
 const n=Math.round(v),pct=Math.min(100,v/2.5),bar=`<div class="th-bar"><i style="width:${pct.toFixed(1)}%"></i></div>`;
 if(st==='rund')return roundGauge(v);
 if(st==='sport')return `<div class="th th-sport"><span class="th-num">${n}</span><span class="th-unit">KM/H</span>${bar}</div>`;
 if(st==='racer')return `<div class="th th-racer"><span class="th-num">${n}</span><span class="th-unit">KM/H · ${v.toFixed(1)}</span>${bar}</div>`;
 if(st==='robust')return `<div class="th th-robust"><div class="th-box"><span class="th-num">${n}</span></div><span class="th-unit">KM/H</span></div>`;
 if(st==='neutral')return `<div class="th th-neutral"><span class="th-num">${n}</span><span class="th-unit">km/h</span></div>`;
 if(st==='spiel')return `<div class="th th-spiel"><span class="th-num">${n}</span><span class="th-unit">km/h · ${limit!=null&&v>limit+S.global.tol?'Du bist zu schnell!':'Alles im Grünen'}</span></div>`;
 return null;
}
function renderSpeed(){
 const v=speedKmh,st=S.global.style,th=themeSpeed(v,st);
 $('#b-speed').innerHTML=st==='cockpit'?cockpit(v):st==='analog'?gauge(v):th!=null?th:`<div class="big">${Math.round(v)}</div><div class="unit">km/h</div>`;
 const over=limit!=null&&v>limit+S.global.tol;
 const al=$('#al-speed');al.style.display=over?'block':'none';if(over)al.textContent=`ÜBER DEM LIMIT +${Math.round(v-limit)} km/h`;
}
function renderLimit(){$('#b-limit').innerHTML=`<div class="big">${limit??'–'}</div><div class="unit">km/h</div><div class="small">${esc(roadType||(limit==null?limitSrc:''))}</div>${errHtml('limit')}${standHtml('limit')}<button class="rf" data-rf="limit">Aktualisieren</button>`}
$('#b-limit').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.rf;if(k)refreshNow(k)});
function renderAccel(){$('#b-accel').innerHTML=`<div class="big">${accel==null?'–':accel.toFixed(1)}</div><div class="unit">m/s² (GPS)</div><div class="small">0–100: ${zeroRes?zeroRes.toFixed(1)+' s':'–'} · Sensor: ${gForce.toFixed(2)} g</div>`}
function setHtml(el,h){if(el._h===h)return;const o=el.querySelector('.scr'),top=o?o.scrollTop:0;el._h=h;el.innerHTML=h;if(top){const n=el.querySelector('.scr');if(n)n.scrollTop=top}}
function renderTrip(){setHtml($('#b-trip'),`<div class="big">${S.trip.trip.toFixed(1)}</div><div class="unit">km Tagesstrecke</div><div class="small">Gesamt ${S.trip.total.toFixed(0)} km</div><button id="rtrip2" style="margin-top:6px">Auf 0 setzen</button>`)}
function renderDay(){
 const avg=S.day.mt>0?Math.round(S.day.dist/(S.day.mt/3600000)):0;
 $('#b-day').innerHTML=`<div class="big" style="font-size:calc(var(--s,1)*36px)">${Math.round(S.day.max)}</div><div class="unit">km/h Höchstwert</div><div class="small">Ø bewegt ${avg} km/h · ${S.day.dist.toFixed(1)} km</div>`;
}
// Geoidhöhe Deutschland (Abstand Ellipsoid WGS84 -> NHN), grobe Näherung aus Stützpunkten (EGM2008), etwa ±2 m

async function obdPoll(){

// Liegt eine Datei www/pursuit.mp3 in der App, wird stattdessen diese abgespielt.
let actx=null,pursuitPending=false,pursuitSaw=false,pursuitTimer=0;

function noiseBuf(c,sec){const b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
const PURSUIT_SEC=20;
function playPursuitSynth(){
 unlockAudio();const c=actx;if(!c)return;
 const t0=c.currentTime+0.05,D=PURSUIT_SEC;
 const master=c.createGain(),comp=c.createDynamicsCompressor();
 master.gain.setValueAtTime(0.0001,t0);master.gain.exponentialRampToValueAtTime(0.9,t0+0.5);
 master.gain.setValueAtTime(0.9,t0+D*0.8);master.gain.exponentialRampToValueAtTime(0.0001,t0+D);
 master.connect(comp);comp.connect(c.destination);
 // Turbinen-Heulen: steigt in 7 s an, bleibt dann hoch
 const o1=c.createOscillator(),f1=c.createBiquadFilter(),g1=c.createGain();
 o1.type='sawtooth';f1.type='lowpass';f1.Q.value=6;
 o1.frequency.setValueAtTime(110,t0);o1.frequency.exponentialRampToValueAtTime(1500,t0+7);o1.frequency.linearRampToValueAtTime(1700,t0+D*0.8);
 f1.frequency.setValueAtTime(400,t0);f1.frequency.exponentialRampToValueAtTime(4000,t0+7);
 g1.gain.setValueAtTime(0.05,t0);g1.gain.linearRampToValueAtTime(0.28,t0+7);
 o1.connect(f1);f1.connect(g1);g1.connect(master);
 // Pulsieren beim Aufladen: wird schneller
 const lfo=c.createOscillator(),lg=c.createGain();
 lfo.frequency.setValueAtTime(3,t0);lfo.frequency.exponentialRampToValueAtTime(28,t0+7);lg.gain.value=0.12;
 lfo.connect(lg);lg.connect(g1.gain);
 // Luftrauschen
 const n=c.createBufferSource(),bp=c.createBiquadFilter(),ng=c.createGain();
 n.buffer=noiseBuf(c,D+0.5);bp.type='bandpass';bp.Q.value=1.2;
 bp.frequency.setValueAtTime(300,t0);bp.frequency.exponentialRampToValueAtTime(3200,t0+7);bp.frequency.setValueAtTime(1800,t0+7.5);
 ng.gain.setValueAtTime(0.02,t0);ng.gain.linearRampToValueAtTime(0.12,t0+7);ng.gain.setValueAtTime(0.35,t0+7.05);ng.gain.exponentialRampToValueAtTime(0.18,t0+9);
 n.connect(bp);bp.connect(ng);ng.connect(master);
 // Schub: Tiefton und Knall bei 7 s
 const sub=c.createOscillator(),sg=c.createGain();
 sub.type='sine';sub.frequency.setValueAtTime(90,t0+7);sub.frequency.exponentialRampToValueAtTime(32,t0+8.6);
 sg.gain.setValueAtTime(0.0001,t0);sg.gain.setValueAtTime(0.9,t0+7);sg.gain.exponentialRampToValueAtTime(0.0001,t0+8.8);
 sub.connect(sg);sg.connect(master);
 [o1,lfo,n,sub].forEach(x=>{x.start(t0);x.stop(t0+D+0.3)});
}

 }
 if(S.global.uiCtl&&AppCtl){

// Abrufe (nur mit Schalter an, im Intervall)
// Overpass: drei Spuren (je ein Server zuerst), damit Tempolimit, Tankstellen und Autobahn gleichzeitig laufen; bei Fehler Ersatzserver
const OV=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const ovLane=[Promise.resolve(),Promise.resolve(),Promise.resolve()];
function ov(q,lane=0,hedge=3000){const p=ovLane[lane].then(()=>ovTry(q,lane,hedge));ovLane[lane]=p.catch(()=>{});return p}
// Gestaffelt: erster Server sofort, bei Fehler oder nach 3 s zusätzlich der nächste; der erste Treffer gewinnt
function ovTry(q,start,hedge){
 return new Promise((resolve,reject)=>{
  let done=false,failed=0,next=0,last='';const timers=[],ctl=new AbortController();
  const fin=(fn,v)=>{if(done)return;done=true;timers.forEach(clearTimeout);try{ctl.abort()}catch(_){}fn(v)};
  const go=()=>{
   if(done||next>=OV.length)return;
   const u=OV[(start+next)%OV.length],h=new URL(u).host;next++;
   timers.push(setTimeout(go,hedge));
   fetch(u+'?data='+encodeURIComponent(q),{signal:ctl.signal})
    .then(r=>{if(!r.ok)throw new Error(h+' HTTP '+r.status);return r.json()})
    .then(j=>fin(resolve,j))
    .catch(e=>{if(done)return;last=h+' '+(e&&e.message||e);failed++;if(failed>=OV.length)fin(reject,new Error(last));else go()});
  };
  go();
 });
}
function parseLimit(tags,country){
 const ms=tags.maxspeed;const pre=((ms||'').match(/^([A-Z]{2}):/)||[])[1]||country||'DE';const T=TAB[pre]||TAB.DE;
 if(ms){
  const n=ms.match(/^(\d+)$/);if(n)return{v:+n[1],src:'OSM-Angabe'};
  if(ms==='none')return{v:T.motorway,src:'frei, Richtwert Autobahn'};
  if(/urban/.test(ms))return{v:T.urban,src:'Richtwert '+pre+' Ortschaft'};
  if(/rural/.test(ms))return{v:T.rural,src:'Richtwert '+pre+' Landstraße'};
  if(/motorway/.test(ms))return{v:T.motorway,src:'Richtwert '+pre+' Autobahn'};
 }
 const h=tags.highway;
 if(h==='motorway'||h==='motorway_link')return{v:T.motorway,src:'Richtwert Autobahn'};
 if(h==='living_street')return{v:7,src:'Richtwert Spielstraße'};
 if(h==='residential')return{v:T.urban,src:'Richtwert Wohnstraße'};
 return{v:T.rural,src:'Richtwert Landstraße'};
}
let country=null;
// Straßenart aus OSM: Autobahn, Landstraße oder Straße (innerorts)
const CAR=/^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service|road)$/;
let roadType='';
if(S.cache.limit){limit=S.cache.limit.v;limitSrc=S.cache.limit.src;roadType=S.cache.limit.road}
function roadKind(t){
 const h=t.highway||'',zone=[t.maxspeed,t['maxspeed:type'],t['zone:maxspeed'],t['source:maxspeed']].join(' ');
 if(/^motorway/.test(h))return 'Autobahn';
 if(/urban/.test(zone)||/^(residential|living_street|service)$/.test(h))return 'Straße';
 if(/rural/.test(zone))return 'Landstraße';
 const n=+((t.maxspeed||'').match(/^\d+/)||[0])[0];
 if(n&&n<=50)return 'Straße';
 if(n>=70||/^(trunk|primary|secondary|tertiary|unclassified)/.test(h))return 'Landstraße';
 return 'Straße';
}

function due(key,minutes){const last=S.last[key]||0;return Date.now()-last>minutes*60000}
function mark(key){S.last[key]=Date.now();save()}
// Fehler je Quelle; bei Fehler neuer Versuch nach 2 Minuten, auch ohne Bewegung
const errs={},fz={};
// Erster Abruf sofort; nach Fehlversuch nach Intervall; sonst bei Bewegung (weit weg: sofort)
function need(key,iv,pos,far,near){
 if(!fz[key])return true;
 if(!pos)return due(key,iv);
 const d=hav(pos.lat,pos.lon,lat,lon);
 return d>far||(due(key,iv)&&d>near);
}
const busy={};
function run(key,iv,fn,onFail){
 mark(key);busy[key]=true;renderAll();
 return fn().then(()=>{
  delete errs[key];busy[key]=false;S.cache.t[key]=Date.now();
  if(key==='fuel')S.cache.fuel=fuelList;if(key==='ab')S.cache.ab=ab;
  save();renderAll();
 }).catch(e=>{
  busy[key]=false;errs[key]=String(e&&e.message||e).slice(0,80);
  S.last[key]=Date.now()-Math.max(0,iv-2)*60000;save();
  if(onFail)onFail();renderAll();
 });
}

 [].concat(keys).forEach(k=>{delete errs[k];S.last[k]=0;fz[k]=false;if(k==='limit')lastLimitPos=null;if(k==='fuel')fuelPos=null;if(k==='ab')abPos=null;if(k==='wx')wxPos=null});
 const sp=S.global.sparmodus;S.global.sparmodus=false;maybeFetch();S.global.sparmodus=sp;renderAll();
}

function maybeFetch(){

 if(!areaPos||hav(areaPos.lat,areaPos.lon,lat,lon)>5000){areaPos={lat,lon};fetchArea().then(()=>{S.last.dwd=0;S.last.heat=0;renderAll()}).catch(()=>{areaPos=null})}
 if(lastLimitPos==null||hav(lastLimitPos.lat,lastLimitPos.lon,lat,lon)>150||Date.now()-limitT>45000){lastLimitPos={lat,lon};fetchLimit().then(()=>{limitT=Date.now();renderAll()}).catch(e=>{errs.limit=String(e&&e.message||e).slice(0,80);renderAll();setTimeout(()=>{lastLimitPos=null},60000)})}
 if(!groundPos||hav(groundPos.lat,groundPos.lon,lat,lon)>300){groundPos={lat,lon};fetchGround().then(renderCompass).catch(()=>{setTimeout(()=>{groundPos=null},120000)})}
 const iv=S.global.iv;
 if(S.global.src.fuel&&need('fuel',iv.fuel,fuelPos,20000,1000)){fz.fuel=true;fuelPos={lat,lon};run('fuel',iv.fuel,fetchFuel,()=>{fuelPos=null})}
 if(S.global.src.weather&&need('wx',iv.weather,wxPos,50000,5000)){fz.wx=true;wxPos={lat,lon};run('wx',iv.weather,fetchWeather,()=>{wxPos=null})}
 if(S.global.src.dwd&&area&&due('dwd',iv.dwd))run('dwd',iv.dwd,fetchDwd);
 if(S.global.src.heat&&area&&due('heat',iv.dwd))run('heat',iv.dwd,fetchHeat);

}

function onPos(p){
 const c=p.coords,t=p.timestamp;
 lat=c.latitude;lon=c.longitude;
 let v=(c.speed!=null&&c.speed>=0)?c.speed*3.6:null,acc=null;
 if(lastPos){
  const dt=(t-lastPos.t)/1000,d=hav(lastPos.lat,lastPos.lon,lat,lon);
  if(c.accuracy<50&&d>3){S.trip.total+=d/1000;S.trip.trip+=d/1000;S.day.dist+=d/1000;if(S.tour.on)S.tour.dist+=d/1000}
  if(v==null&&dt>0)v=(d/dt)*3.6;
  if(dt>0&&v!=null&&lastPos.v!=null)acc=(v-lastPos.v)/3.6/dt;
 }
 if(v==null)v=0;
 if(S.tour.on){
  if(v>(S.tour.max||0))S.tour.max=v;
  if(lastPos&&v>=3)S.tour.mt+=Math.min(t-lastPos.t,60000);
  if(v<3){if(!S.tour.stopT)S.tour.stopT=t;if(t-S.tour.stopT>600000){S.tour.since=t;S.tour.warned=false}}else S.tour.stopT=0;
  if(!S.tour.since)S.tour.since=t;
  if(!S.tour.warned&&v>=3&&t-S.tour.since>PAUSE_H*3600000){S.tour.warned=true;say(`${S.global.anrede||'Michael'}, du bist seit zwei Stunden unterwegs. Zeit für eine Pause.`)}
 }
 const today=new Date().toDateString();
 if(S.day.d!==today)S.day={d:today,max:0,mt:0,dist:0};
 if(c.accuracy<50&&v<250&&v>S.day.max)S.day.max=v;
 if(lastPos&&v>=3)S.day.mt+=Math.min(t-lastPos.t,60000);
 if(v<3){zeroT=t;zeroRes=null}
 if(zeroT&&v>=100&&zeroRes==null)zeroRes=(t-zeroT)/1000;
 if(acc!=null)accel=acc;
 lastPos={lat,lon,t,v};speedKmh=v;
 if(c.heading!=null&&!isNaN(c.heading)){heading=c.heading;headT=Date.now()}
 gpsAcc=c.accuracy;S.lp={lat,lon};
 if(c.altitude!=null&&!isNaN(c.altitude)){alt=c.altitude;altAcc=c.altitudeAccuracy}
 save();renderAll();maybeFetch();
}

if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(!lastPos&&(lat==null||hav(lat,lon,p.coords.latitude,p.coords.longitude)>2000)){lat=p.coords.latitude;lon=p.coords.longitude;maybeFetch();renderAll()}},()=>{},{enableHighAccuracy:false,maximumAge:600000,timeout:10000});
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0});
else onErr();

   if(el)el.textContent=txt;
   say(`${S.global.anrede||'Michael'}, Sprachprüfung. Lautstärke ${S.global.vvol} Prozent.`);
  }).catch(e=>{if(el)el.textContent='Status: Prüfung fehlgeschlagen: '+(e&&e.message||e)});
 }
 if(id==='vtest')say(`${S.global.anrede||'Michael'}, hier ist KITT. Alle Systeme laufen.`);
 if(id==='refall'){lastLimitPos=null;refreshNow(['fuel','ab','wx','dwd','heat']);$('#menu').classList.remove('open')}
 if(id==='sens'){try{if(window.DeviceMotionEvent?.requestPermission)await DeviceMotionEvent.requestPermission();if(window.DeviceOrientationEvent?.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(_){}}
 if(id==='reset'&&confirm('Alle Einstellungen und Strecken löschen?')){try{localStorage.removeItem('gpsdash')}catch(_){}location.reload()}
});

// Navigation: Tankstelle gedrückt halten -> Google Maps / Sygic / andere Karten-App
let navT=null,navStart=null;
function openNav(i){
 const f=fuelSorted()[i];if(!f)return;
 const n=encodeURIComponent(f.name);
 const L={
  google:`google.navigation:q=${f.la},${f.lo}&mode=d`,
  sygic:`com.sygic.aura://coordinate|${f.lo}|${f.la}|drive`,
  geo:`geo:${f.la},${f.lo}?q=${f.la},${f.lo}(${n})`,
  web:`https://www.google.com/maps/dir/?api=1&destination=${f.la},${f.lo}&travelmode=driving`};
 $('#navbox').innerHTML=`<b>${esc(f.name)} · ${f.d.toFixed(1)} km</b><button data-go="google">Google Maps</button><button data-go="sygic">Sygic</button><button data-go="geo">Andere Karten-App</button><button data-go="web">Im Browser öffnen</button><button data-go="x">Abbrechen</button>`;
 $('#navbox').onclick=e=>{const g=e.target.dataset.go;if(!g)return;$('#navsheet').classList.remove('open');if(g==='x')return;location.href=L[g]};
 $('#navsheet').classList.add('open');
}
$('#navsheet').addEventListener('click',e=>{if(e.target.id==='navsheet')e.target.classList.remove('open')});
const fuelBox=$('#b-fuel');
fuelBox.addEventListener('contextmenu',e=>{if(e.target.closest('li.nav'))e.preventDefault()});
fuelBox.addEventListener('pointerdown',e=>{
 const li=e.target.closest('li.nav');if(!li)return;
 navStart={x:e.clientX,y:e.clientY};clearTimeout(navT);
 navT=setTimeout(()=>{navT=null;if(navigator.vibrate)navigator.vibrate(30);openNav(+li.dataset.i)},600);
});
fuelBox.addEventListener('pointermove',e=>{if(navT&&navStart&&Math.hypot(e.clientX-navStart.x,e.clientY-navStart.y)>12){clearTimeout(navT);navT=null}});
['pointerup','pointercancel','pointerleave'].forEach(t=>fuelBox.addEventListener(t,()=>{clearTimeout(navT);navT=null}));

$('#b-trip').addEventListener('click',e=>{if(e.target.id==='rtrip2'&&confirm('Tageskilometer auf 0 setzen?')){S.trip.trip=0;save();renderTrip()}});
fuelList=S.cache.fuel||[];ab=S.cache.ab||[];
['#b-fuel','#b-traffic'].forEach(id=>$(id).addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.sc;if(k){S.global[k]=e.target.checked;save();renderAll()}}));
['#b-fuel','#b-traffic'].forEach(id=>$(id).addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.rf;if(k)refreshNow(k)}));
if(Voice){Voice.addListener('speech',d=>heard(d.text,d.alts));Voice.addListener('wake',()=>{toast('Ja, ich höre …',2500)});Voice.addListener('spoke',d=>{lastSpoke=Date.now();voiceLast='spricht ('+(d.via||'?')+')';const el=$('#vstat');if(el)el.textContent='Status: '+voiceLast});Voice.addListener('state',d=>{voiceState=d;if(pursuitPending){if(d.speaking)pursuitSaw=true;else if(pursuitSaw)pursuitDone()}voiceLast=d.error||d.info||(d.speaking?'spricht':d.recording?'hört auf Befehl':d.listening?'wartet auf „KITT“':'bereit');if(d.error)toast('Mikrofon: '+d.error,5000);else if(d.info)toast(d.info,3000);paintMic();const el=$('#vstat');if(el)el.textContent='Status: '+voiceLast});Voice.voices().then(r=>{voiceList=r.voices||[]}).catch(()=>{})}
$('#mic').onclick=()=>{if(S.global.vmode==='push')talkOnce();else setVoice(!voiceOn)};
document.addEventListener('visibilitychange',()=>{if(!voiceOn||!Voice||S.global.keepAlive)return;if(document.visibilityState==='hidden')Voice.stopListening().catch(()=>{});else Voice.listen().catch(()=>{})});
if(S.global.btMic&&AppCtl)AppCtl.bt({on:true}).catch(()=>{});
if(S.global.voice&&S.global.vmode==='wake')setVoice(true);else if(S.global.voice){S.global.voice=false;save()}
applyCfg();renderAll();wake();applyOrient();startSat();
setInterval(renderCustom,1000);
setInterval(()=>{if(S.global.style==='cockpit')renderSpeed()},250);
</script>
<script src="designer.js"></script>
</body>
</html>
